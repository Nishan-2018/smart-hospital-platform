# SecretProviderClass for Azure Key Vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets
  namespace: smart-hospital
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""  # Set via Helm values
    keyvaultName: ""            # Set via Helm values
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: db-admin-login
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-admin-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: rabbitmq-url
          objectType: secret
          objectVersion: ""
    tenantId: ""  # Set via Helm values
  secretObjects:
    - secretName: patient-db-secret
      type: Opaque
      data:
        - objectName: db-admin-login
          key: username
        - objectName: db-admin-password
          key: password
    - secretName: appointment-db-secret
      type: Opaque
      data:
        - objectName: db-admin-login
          key: username
        - objectName: db-admin-password
          key: password
    - secretName: rabbitmq-secret
      type: Opaque
      data:
        - objectName: rabbitmq-url
          key: url
