{{- range $key, $service := dict "patient" .Values.patientService "appointment" .Values.appointmentService "notification" .Values.notificationService "ai" .Values.aiPredictionService }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $service.name }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    release: {{ $.Release.Name }}
    environment: {{ $.Values.global.environment }}
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app: {{ $service.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $service.name }}
        version: {{ $service.image.tag }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: {{ $service.name }}
          image: "{{ $.Values.image.registry }}/{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $service.port }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ $.Values.database.host | quote }}
            - name: DB_NAME
              value: {{ index $.Values.database.names $key | default $service.name | quote }}
            - name: DB_USER
              value: {{ $.Values.database.user | quote }}
            - name: DB_PASSWORD
              value: {{ $.Values.database.password | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_SSL
              value: "true"
            - name: RABBITMQ_URL
              value: {{ $.Values.rabbitmq.url | quote }}
            - name: PATIENT_SERVICE_URL
              value: "http://patient-service.{{ $.Values.global.namespace }}.svc.cluster.local"
            - name: APPOINTMENT_SERVICE_URL
              value: "http://appointment-service.{{ $.Values.global.namespace }}.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: {{ $service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: {{ $service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $service.name }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ $service.port }}
  selector:
    app: {{ $service.name }}
{{- end }}
{{- end }}
