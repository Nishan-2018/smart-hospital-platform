input {
  tcp {
    port => 5044
    codec => json_lines
  }
  
  beats {
    port => 5045
  }
}

filter {
  if [service] {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "%{service}" }
    }
  } else {
    mutate {
      add_field => { "[@metadata][index_prefix]" => "unknown" }
    }
  }

  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
  }

  # Parse JSON message if present
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed_message"
    }
  }

  # Add environment tag
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "platform" => "smart-hospital"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
  }

  # Debug output
  stdout {
    codec => rubydebug
  }
}
