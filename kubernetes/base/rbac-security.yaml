# RBAC Configuration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smart-hospital-sa
  namespace: smart-hospital
  labels:
    app.kubernetes.io/part-of: smart-hospital
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smart-hospital-role
  namespace: smart-hospital
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smart-hospital-rolebinding
  namespace: smart-hospital
subjects:
  - kind: ServiceAccount
    name: smart-hospital-sa
    namespace: smart-hospital
roleRef:
  kind: Role
  name: smart-hospital-role
  apiGroup: rbac.authorization.k8s.io
---
# Network Policy - Default deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smart-hospital
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress from within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: smart-hospital
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: smart-hospital
        - podSelector: {}
---
# Allow ingress from nginx-ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traffic
  namespace: smart-hospital
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: smart-hospital
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              purpose: monitoring
      ports:
        - port: 3001
        - port: 3002
        - port: 3003
        - port: 3004
---
# Resource Quotas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: smart-hospital-quota
  namespace: smart-hospital
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "50"
---
# Limit Range
apiVersion: v1
kind: LimitRange
metadata:
  name: smart-hospital-limits
  namespace: smart-hospital
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
