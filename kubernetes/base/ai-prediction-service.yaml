apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-prediction-service
  namespace: smart-hospital
  labels:
    app: ai-prediction-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-prediction-service
  template:
    metadata:
      labels:
        app: ai-prediction-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: smart-hospital-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ai-prediction-service
          image: ${ACR_LOGIN_SERVER}/ai-prediction-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          env:
            - name: FLASK_ENV
              value: "production"
            - name: PORT
              value: "3004"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-prediction-service
  namespace: smart-hospital
  labels:
    app: ai-prediction-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3004
  selector:
    app: ai-prediction-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-prediction-service-hpa
  namespace: smart-hospital
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-prediction-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
