name: Smart Hospital CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

env:
  ACR_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  # ============================================
  # Stage 1: Build and Test
  # ============================================
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - patient-service
          - appointment-service
          - notification-service
      fail-fast: false

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: microservices/${{ matrix.service }}/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: microservices/${{ matrix.service }}
        run: npm ci

      - name: 🔍 Lint Code
        working-directory: microservices/${{ matrix.service }}
        run: npm run lint || true

      - name: 🧪 Run Unit Tests
        working-directory: microservices/${{ matrix.service }}
        run: npm test
        env:
          NODE_ENV: test

      - name: 📊 Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: microservices/${{ matrix.service }}/coverage/

  # Build and test AI Prediction Service (Python)
  build-and-test-ai:
    name: "Build & Test AI Service"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        working-directory: microservices/ai-prediction-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Tests
        working-directory: microservices/ai-prediction-service
        run: pytest tests/ -v --cov=src --cov-report=xml

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ai-prediction-service
          path: microservices/ai-prediction-service/coverage.xml

  # ============================================
  # Stage 2: Static Code Analysis
  # ============================================
  code-analysis:
    name: "Static Code Analysis (SonarQube)"
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-test-ai]
    if: false
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports/

      - name: 🔍 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=smart-hospital
            -Dsonar.projectName=Smart Hospital Platform
            -Dsonar.sources=microservices/
            -Dsonar.tests=microservices/
            -Dsonar.test.inclusions=**/tests/**,**/test/**
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**

  # ============================================
  # Stage 3: Security Scanning
  # ============================================
  security-scan:
    name: "Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-test-ai]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service:
          - patient-service
          - appointment-service
          - notification-service
          - ai-prediction-service
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker Image
        working-directory: microservices/${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:scan .

      - name: 🔒 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:scan'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📤 Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

      - name: 🔒 Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'microservices/${{ matrix.service }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ============================================
  # Stage 4: Build and Push Docker Images
  # ============================================
  docker-build-push:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    strategy:
      matrix:
        service:
          - patient-service
          - appointment-service
          - notification-service
          - ai-prediction-service
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔑 Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🏷️ Generate Image Tag
        id: tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH=${GITHUB_REF#refs/heads/}
          BRANCH=${BRANCH//\//-}
          echo "sha_tag=${SHA}" >> $GITHUB_OUTPUT
          echo "branch_tag=${BRANCH}" >> $GITHUB_OUTPUT
          echo "full_tag=${BRANCH}-${SHA}" >> $GITHUB_OUTPUT

      - name: 🐳 Build and Push Docker Image
        working-directory: microservices/${{ matrix.service }}
        run: |
          docker build \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${{ steps.tag.outputs.full_tag }} \
            -t ${{ env.ACR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.full_tag }} \
            -t ${{ env.ACR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.branch_tag }}-latest \
            -t ${{ env.ACR_REGISTRY }}/${{ matrix.service }}:latest \
            .
          docker push ${{ env.ACR_REGISTRY }}/${{ matrix.service }} --all-tags

  # ============================================
  # Stage 5: Deploy to Dev
  # ============================================
  deploy-dev:
    name: "Deploy to Dev"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: dev
      url: https://dev-api.smarthospital.com
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ☸️ Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Deploy with Helm
        run: |
          helm upgrade --install smart-hospital ./helm/smart-hospital \
            --namespace smart-hospital \
            --create-namespace \
            -f ./helm/smart-hospital/values.yaml \
            --set global.environment=dev \
            --set image.registry=${{ env.ACR_REGISTRY }} \
            --set patientService.image.tag=${{ github.sha }} \
            --set appointmentService.image.tag=${{ github.sha }} \
            --set notificationService.image.tag=${{ github.sha }} \
            --set aiPredictionService.image.tag=${{ github.sha }} \
            --wait --timeout=600s

      - name: ✅ Verify Deployment
        run: |
          kubectl get deployments -n smart-hospital
          kubectl get pods -n smart-hospital

  # ============================================
  # Stage 6: Deploy to Staging
  # ============================================
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: startsWith(github.ref, 'refs/heads/release/')
    environment:
      name: staging
      url: https://staging-api.smarthospital.com
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ☸️ Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Deploy with Helm
        run: |
          helm upgrade --install smart-hospital ./helm/smart-hospital \
            --namespace smart-hospital \
            --create-namespace \
            -f ./helm/smart-hospital/values.yaml \
            --set global.environment=staging \
            --set image.registry=${{ env.ACR_REGISTRY }} \
            --set patientService.image.tag=${{ github.sha }} \
            --set appointmentService.image.tag=${{ github.sha }} \
            --set notificationService.image.tag=${{ github.sha }} \
            --set aiPredictionService.image.tag=${{ github.sha }} \
            --wait --timeout=600s

  # ============================================
  # Stage 7: Deploy to Production
  # ============================================
  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.smarthospital.com
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🔑 Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ☸️ Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: 🚀 Deploy with Helm
        run: |
          helm upgrade --install smart-hospital ./helm/smart-hospital \
            --namespace smart-hospital \
            --create-namespace \
            -f ./helm/smart-hospital/values.yaml \
            --set global.environment=production \
            --set image.registry=${{ env.ACR_REGISTRY }} \
            --set patientService.image.tag=${{ github.sha }} \
            --set appointmentService.image.tag=${{ github.sha }} \
            --set notificationService.image.tag=${{ github.sha }} \
            --set aiPredictionService.image.tag=${{ github.sha }} \
            --set patientService.replicas=3 \
            --set appointmentService.replicas=3 \
            --set aiPredictionService.replicas=3 \
            --wait --timeout=600s

      - name: ✅ Verify Production Deployment
        run: |
          kubectl get deployments -n smart-hospital
          kubectl rollout status deployment/patient-service -n smart-hospital
          kubectl rollout status deployment/appointment-service -n smart-hospital
          kubectl rollout status deployment/notification-service -n smart-hospital
          kubectl rollout status deployment/ai-prediction-service -n smart-hospital
